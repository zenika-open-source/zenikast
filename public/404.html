<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Zenikast</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Stores the current path in sessionStorage and redirects to index.html
      // Source: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0; // Keep / as the base
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
